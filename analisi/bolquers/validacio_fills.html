<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validació de fills — Aplicació Bolquers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #ececec;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 48px 24px;
  }
  .card {
    background: #f5f5f5;
    border-radius: 12px;
    border: 1px solid rgba(45,49,66,0.12);
    padding: 40px 40px 36px;
    max-width: 820px;
    width: 100%;
  }
  .eyebrow {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #7a8399;
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Instrument Serif', serif;
    font-size: 1.75rem;
    font-weight: 400;
    color: #2d3142;
    margin-bottom: 6px;
  }
  .subtitle {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: #7a8399;
    margin-bottom: 28px;
  }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="card">
  <p class="eyebrow">Flowchart de decisió</p>
  <h1>Validació de fills</h1>
  <p class="subtitle">2 camins per col·lectiu: GT (àmbit) · Document acreditatiu (externs) · Fallback manual excepcional</p>

  <svg viewBox="0 0 820 940" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-labelledby="fc-title fc-desc">
    <title id="fc-title">Flux de validació de fills</title>
    <desc id="fc-desc">Flowchart de validació de fills amb dos camins per col·lectiu: personal de l'àmbit (DT, IAS) el gestor consulta GT; personal extern adjunta document acreditatiu que el gestor revisa. Ambdós disposen de fallback de validació manual excepcional. El rebuig definitiu genera email i registre a audit_log.</desc>

    <defs>
      <marker id="arr" viewBox="0 0 10 10" markerWidth="6" markerHeight="6"
              refX="9" refY="5" orient="auto">
        <path d="M1,1 L9,5 L1,9 L2.5,5Z" fill="#2d3142"/>
      </marker>
      <marker id="arr-m" viewBox="0 0 10 10" markerWidth="6" markerHeight="6"
              refX="9" refY="5" orient="auto">
        <path d="M1,1 L9,5 L1,9 L2.5,5Z" fill="#4f5d75"/>
      </marker>
      <marker id="arr-acc" viewBox="0 0 10 10" markerWidth="6" markerHeight="6"
              refX="9" refY="5" orient="auto">
        <path d="M1,1 L9,5 L1,9 L2.5,5Z" fill="#eb6c36"/>
      </marker>
    </defs>

    <!-- ZONES: àmbit (esquerra), extern (dret) -->
    <rect x="8"   y="200" width="390" height="370" rx="6"
          fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
    <rect x="14"  y="204" width="128" height="12" rx="2" fill="#f5f5f5"/>
    <text x="78"  y="213" text-anchor="middle" fill="rgba(45,49,66,0.35)"
          font-family="'Geist Mono',monospace" font-size="7" letter-spacing="0.14em">PERSONAL DE L'ÀMBIT</text>

    <rect x="422" y="200" width="390" height="370" rx="6"
          fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
    <rect x="428" y="204" width="110" height="12" rx="2" fill="#f5f5f5"/>
    <text x="483" y="213" text-anchor="middle" fill="rgba(45,49,66,0.35)"
          font-family="'Geist Mono',monospace" font-size="7" letter-spacing="0.14em">PERSONAL EXTERN</text>

    <!-- ZONA FALLBACK -->
    <rect x="8" y="590" width="804" height="170" rx="6"
          fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
    <rect x="14" y="594" width="182" height="12" rx="2" fill="#f5f5f5"/>
    <text x="105" y="603" text-anchor="middle" fill="rgba(45,49,66,0.35)"
          font-family="'Geist Mono',monospace" font-size="7" letter-spacing="0.14em">FALLBACK · VALIDACIÓ MANUAL EXCEPCIONAL</text>

    <!-- INICI -->
    <rect x="260" y="16" width="300" height="36" rx="18" fill="#2d3142"/>
    <text x="410" y="38" text-anchor="middle" fill="white"
          font-family="'Geist',sans-serif" font-size="11" font-weight="600">Alta fill per professional</text>
    <path d="M 410,52 V 84" fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- D1: col·lectiu de l'àmbit o extern? -->
    <polygon points="410,84 530,118 410,152 290,118" fill="white" stroke="#2d3142" stroke-width="1"/>
    <text x="410" y="112" text-anchor="middle" fill="#2d3142"
          font-family="'Geist',sans-serif" font-size="10" font-weight="600">Col·lectiu</text>
    <text x="410" y="127" text-anchor="middle" fill="#2d3142"
          font-family="'Geist',sans-serif" font-size="10" font-weight="600">de l'àmbit?</text>

    <!-- D1 Sí -> camí àmbit (esquerra) -->
    <path d="M 290,118 H 208 Q 200,118 200,126 V 218"
          fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="218" y="109" width="30" height="14" rx="2" fill="#f5f5f5"/>
    <text x="233" y="120" text-anchor="middle" fill="#2d3142"
          font-family="'Geist Mono',monospace" font-size="8">Sí</text>
    <rect x="136" y="154" width="118" height="14" rx="2" fill="#f5f5f5"/>
    <text x="195" y="164" text-anchor="middle" fill="#7a8399"
          font-family="'Geist Mono',monospace" font-size="8">DT · IAS</text>

    <!-- D1 No -> camí extern (dret) -->
    <path d="M 530,118 H 616 Q 624,118 624,126 V 218"
          fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="530" y="109" width="30" height="14" rx="2" fill="#f5f5f5"/>
    <text x="545" y="120" text-anchor="middle" fill="#2d3142"
          font-family="'Geist Mono',monospace" font-size="8">No</text>
    <rect x="556" y="154" width="136" height="14" rx="2" fill="#f5f5f5"/>
    <text x="624" y="164" text-anchor="middle" fill="#7a8399"
          font-family="'Geist Mono',monospace" font-size="8">DT Externs · IAS Externs</text>

    <!-- CAMÍ ÀMBIT -->

    <!-- Gestor consulta GT -->
    <rect x="50" y="218" width="300" height="44" rx="6"
          fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/>
    <text x="200" y="236" text-anchor="middle" fill="#2d3142"
          font-family="'Geist',sans-serif" font-size="11" font-weight="600">GESTOR consulta GT</text>
    <text x="200" y="251" text-anchor="middle" fill="#4f5d75"
          font-family="'Geist Mono',monospace" font-size="9">aplicació RRHH hospitalària</text>

    <!-- D2 GT confirma? -->
    <path d="M 200,262 V 298" fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>
    <polygon points="200,298 300,326 200,354 100,326" fill="white" stroke="#2d3142" stroke-width="1"/>
    <text x="200" y="321" text-anchor="middle" fill="#2d3142"
          font-family="'Geist',sans-serif" font-size="10" font-weight="600">GT</text>
    <text x="200" y="336" text-anchor="middle" fill="#2d3142"
          font-family="'Geist',sans-serif" font-size="10" font-weight="600">confirma?</text>

    <!-- D2 Sí -> Validació via GT (FOCAL) -->
    <path d="M 200,354 V 400" fill="none" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arr-acc)"/>
    <rect x="166" y="356" width="30" height="14" rx="2" fill="#f5f5f5"/>
    <text x="181" y="367" text-anchor="middle" fill="#eb6c36"
          font-family="'Geist Mono',monospace" font-size="8">Sí</text>
    <rect x="50" y="400" width="300" height="36" rx="6"
          fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
    <text x="200" y="422" text-anchor="middle" fill="#2d3142"
          font-family="'Geist',sans-serif" font-size="11" font-weight="600">✓ Validació via GT</text>
    <path d="M 200,436 V 448" fill="none" stroke="#eb6c36" stroke-width="1.2"/>
    <circle cx="200" cy="452" r="4" fill="#eb6c36"/>

    <!-- D2 No -> fallback (àmbit) -->
    <path d="M 100,326 H 64 Q 56,326 56,334 V 608"
          fill="none" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4,3"
          marker-end="url(#arr-m)"/>
    <rect x="60" y="314" width="24" height="14" rx="2" fill="#f5f5f5"/>
    <text x="72" y="325" text-anchor="middle" fill="#4f5d75"
          font-family="'Geist Mono',monospace" font-size="8">No</text>

    <!-- CAMÍ EXTERN -->

    <!-- Professional adjunta document -->
    <rect x="470" y="218" width="300" height="44" rx="6"
          fill="white" stroke="#2d3142" stroke-width="1"/>
    <text x="620" y="236" text-anchor="middle" fill="#2d3142"
          font-family="'Geist',sans-serif" font-size="11" font-weight="600">Professional adjunta doc</text>
    <text x="620" y="251" text-anchor="middle" fill="#4f5d75"
          font-family="'Geist Mono',monospace" font-size="9">document acreditatiu · upload</text>

    <!-- Gestor revisa document -->
    <path d="M 620,262 V 290" fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>
    <rect x="470" y="290" width="300" height="44" rx="6"
          fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/>
    <text x="620" y="308" text-anchor="middle" fill="#2d3142"
          font-family="'Geist',sans-serif" font-size="11" font-weight="600">GESTOR revisa document</text>
    <text x="620" y="323" text-anchor="middle" fill="#4f5d75"
          font-family="'Geist Mono',monospace" font-size="9">validació visual</text>

    <!-- D3 Document vàlid? -->
    <path d="M 620,334 V 368" fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>
    <polygon points="620,368 720,396 620,424 520,396" fill="white" stroke="#2d3142" stroke-width="1"/>
    <text x="620" y="391" text-anchor="middle" fill="#2d3142"
          font-family="'Geist',sans-serif" font-size="10" font-weight="600">Document</text>
    <text x="620" y="406" text-anchor="middle" fill="#2d3142"
          font-family="'Geist',sans-serif" font-size="10" font-weight="600">vàlid?</text>

    <!-- D3 Sí -> Validació per document (FOCAL) -->
    <path d="M 620,424 V 470" fill="none" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arr-acc)"/>
    <rect x="586" y="426" width="30" height="14" rx="2" fill="#f5f5f5"/>
    <text x="601" y="437" text-anchor="middle" fill="#eb6c36"
          font-family="'Geist Mono',monospace" font-size="8">Sí</text>
    <rect x="470" y="470" width="300" height="36" rx="6"
          fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
    <text x="620" y="492" text-anchor="middle" fill="#2d3142"
          font-family="'Geist',sans-serif" font-size="11" font-weight="600">✓ Validació per document</text>
    <path d="M 620,506 V 516" fill="none" stroke="#4f5d75" stroke-width="1"/>
    <rect x="538" y="508" width="164" height="14" rx="2" fill="#f5f5f5"/>
    <text x="620" y="519" text-anchor="middle" fill="#4f5d75"
          font-family="'Geist Mono',monospace" font-size="8">document eliminat (RGPD)</text>
    <circle cx="620" cy="526" r="4" fill="#eb6c36"/>

    <!-- D3 No -> fallback (extern) -->
    <path d="M 720,396 H 766 Q 774,396 774,404 V 608"
          fill="none" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4,3"
          marker-end="url(#arr-m)"/>
    <rect x="716" y="384" width="24" height="14" rx="2" fill="#f5f5f5"/>
    <text x="728" y="395" text-anchor="middle" fill="#4f5d75"
          font-family="'Geist Mono',monospace" font-size="8">No</text>
    <rect x="692" y="436" width="128" height="14" rx="2" fill="#f5f5f5"/>
    <text x="756" y="447" text-anchor="middle" fill="#7a8399"
          font-family="'Geist Mono',monospace" font-size="8">doc eliminat (RGPD)</text>

    <!-- FALLBACK: merge + manual excepcional -->
    <line x1="56" y1="608" x2="406" y2="608" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4,3"/>
    <line x1="774" y1="608" x2="414" y2="608" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4,3"/>
    <circle cx="410" cy="608" r="4" fill="#4f5d75"/>

    <!-- Gestor documenta excepció -->
    <path d="M 410,612 V 626" fill="none" stroke="#4f5d75" stroke-width="1.1"
          stroke-dasharray="4,3" marker-end="url(#arr-m)"/>
    <rect x="240" y="626" width="340" height="44" rx="6"
          fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/>
    <text x="410" y="644" text-anchor="middle" fill="#2d3142"
          font-family="'Geist',sans-serif" font-size="11" font-weight="600">GESTOR documenta excepció</text>
    <text x="410" y="659" text-anchor="middle" fill="#4f5d75"
          font-family="'Geist Mono',monospace" font-size="9">motiu + justificació obligatòria</text>

    <!-- D4: Excepció aprovada? -->
    <path d="M 410,670 V 706" fill="none" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arr)"/>
    <polygon points="410,706 510,734 410,762 310,734" fill="white" stroke="#2d3142" stroke-width="1"/>
    <text x="410" y="729" text-anchor="middle" fill="#2d3142"
          font-family="'Geist',sans-serif" font-size="10" font-weight="600">Excepció</text>
    <text x="410" y="744" text-anchor="middle" fill="#2d3142"
          font-family="'Geist',sans-serif" font-size="10" font-weight="600">aprovada?</text>

    <!-- D4 Sí -> Validació manual -->
    <path d="M 510,734 H 562" fill="none" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arr-acc)"/>
    <rect x="512" y="725" width="30" height="14" rx="2" fill="#f5f5f5"/>
    <text x="527" y="736" text-anchor="middle" fill="#eb6c36"
          font-family="'Geist Mono',monospace" font-size="8">Sí</text>
    <rect x="562" y="716" width="230" height="44" rx="6"
          fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
    <text x="677" y="734" text-anchor="middle" fill="#2d3142"
          font-family="'Geist',sans-serif" font-size="11" font-weight="600">✓ Validació manual</text>
    <text x="677" y="749" text-anchor="middle" fill="#4f5d75"
          font-family="'Geist Mono',monospace" font-size="9">registrat a audit_log</text>
    <path d="M 677,760 V 770" fill="none" stroke="#eb6c36" stroke-width="1.2"/>
    <circle cx="677" cy="774" r="4" fill="#eb6c36"/>

    <!-- D4 No -> Rebuig definitiu -->
    <path d="M 310,734 H 256 Q 248,734 248,742 V 790"
          fill="none" stroke="#4f5d75" stroke-width="1.1" stroke-dasharray="4,3"
          marker-end="url(#arr-m)"/>
    <rect x="264" y="722" width="24" height="14" rx="2" fill="#f5f5f5"/>
    <text x="276" y="733" text-anchor="middle" fill="#4f5d75"
          font-family="'Geist Mono',monospace" font-size="8">No</text>

    <rect x="132" y="790" width="226" height="44" rx="6"
          fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/>
    <text x="245" y="808" text-anchor="middle" fill="#4f5d75"
          font-family="'Geist',sans-serif" font-size="11" font-weight="600">✗ Rebuig definitiu</text>
    <text x="245" y="823" text-anchor="middle" fill="#7a8399"
          font-family="'Geist Mono',monospace" font-size="9">email al professional + audit_log</text>
    <path d="M 245,834 V 854" fill="none" stroke="#4f5d75" stroke-width="1.1"/>
    <circle cx="245" cy="858" r="7" fill="none" stroke="#4f5d75" stroke-width="1.5"/>
    <circle cx="245" cy="858" r="3.5" fill="#4f5d75"/>

    <!-- MERGE finals -> fill actiu -->
    <path d="M 200,456 V 822 Q 200,830 208,830 H 406"
          fill="none" stroke="#eb6c36" stroke-width="1.2"/>
    <path d="M 620,530 V 818 Q 620,826 612,826 H 414"
          fill="none" stroke="#eb6c36" stroke-width="1.2"/>
    <path d="M 677,778 V 814 Q 677,822 669,822 H 414"
          fill="none" stroke="#eb6c36" stroke-width="1.2"/>

    <circle cx="410" cy="828" r="4" fill="#eb6c36"/>
    <path d="M 410,832 V 852" fill="none" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arr-acc)"/>

    <!-- oval final -->
    <rect x="230" y="852" width="360" height="40" rx="20" fill="#eb6c36"/>
    <text x="410" y="876" text-anchor="middle" fill="white"
          font-family="'Geist',sans-serif" font-size="11" font-weight="600">Fill actiu · pot generar comandes</text>

  </svg>
</div>
</body>
</html>
